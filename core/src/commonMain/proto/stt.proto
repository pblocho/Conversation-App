syntax = "proto3";

package com.pibi.conversation.grpc;

// Speech-to-text: client streams microphone audio, server streams back transcripts.
service SttService {
  rpc Transcribe(stream AudioChunk) returns (stream Transcript);
}

message AudioChunk {
  // Raw PCM audio bytes. Empty when end_of_utterance is set.
  bytes data = 1;
  // Marks the end of an utterance (replaces the empty WebSocket frame signal).
  bool end_of_utterance = 2;
}

message Transcript {
  string text = 1;
  // True on the last transcript of an utterance, so the client knows the question is complete.
  //
  // One utterance can come back as several transcripts, because the recognizer may split it into
  // segments. An utterance that turned out to hold no speech is reported as a single transcript
  // with empty text and this flag set, rather than as silence the client has to time out on.
  // Mirrors end_of_answer on the way down.
  bool is_final = 2;
}
