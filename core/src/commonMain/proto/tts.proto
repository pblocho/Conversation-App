syntax = "proto3";

package com.pibi.conversation.grpc;

// Text-to-speech: client streams text pieces, server streams back WAV audio.
service TtsService {
  rpc Synthesize(stream TextPiece) returns (stream AudioData);
}

message TextPiece {
  string text = 1;
}

message AudioData {
  // WAV-encoded audio bytes for playback. Empty on the end-of-answer marker.
  bytes data = 1;
  // The text this audio chunk was synthesized from. Empty on the end-of-answer marker.
  string text = 2;
  // Marks the end of one answer, as a message of its own carrying no audio and no text.
  //
  // One stream serves many turns — the backend keeps the LLM chat history per stream — so the
  // end of an answer cannot be signalled by closing the stream the way a plain RPC would.
  // Mirrors end_of_utterance on the way up.
  bool end_of_answer = 3;
}
